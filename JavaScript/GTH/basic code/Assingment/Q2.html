<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function changeBg()
        {
            let para=document.getElementById("para");
            para.style.background="red";
        }
    </script>
</head>
<body>
    <p id="para">2. Change Background Color
Description: Change page background color using a button.
Practice: style
</p>
<button onclick="changeBg()">change bg color</button>
</body>
</html>
