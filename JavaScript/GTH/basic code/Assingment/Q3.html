<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function shoHide(){
            let para=document.getElementById("para");
            let btn=document.getElementById("btn");

            if(document.getElementById("btn").value=="show")
            {
                btn.innerHTML="Hide"
                para.style.display="block";
                btn.setAttribute("value","hide");
            }
            else
            {
                btn.innerHTML="Show"
                para.style.display="none";
                btn.setAttribute("value","show");
            }
        }
    </script>
</head>
<body>
    <p id="para">3. Show/Hide Element
Description: Toggle visibility of a div.
Practice: style.display
</p>
<button id="btn" onclick="shoHide()" value="show">show</button>
</body>
</html>
