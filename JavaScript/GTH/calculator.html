<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="calculator.css">
    <script type="text/javascript" src="calculator.js"></script>
</head>
<body>

    <table id="tb">
        <tr ><td colspan="4"><input type="text" id="result"></td></tr>
        <tr>
            <td><button id="k1" value="1">1</button></td>
            <td><button id="k2" value="2">2</button></td>
            <td><button id="k3" value="3">3</button></td>
            <td><button id="add">+</button></td>
        </tr>
        <tr>
            <td><button id="k4" value="4">4</button></td>
            <td><button id="k5" value="5">5</button></td>
            <td><button id="k6" value="6">6</button></td>
            <td><button id="sub">-</button></td>
        </tr>
        <tr>
            <td><button id="k7" value="7">7</button></td>
            <td><button id="k8" value="8">8</button></td>
            <td><button id="k9" value="0">9</button></td>
            <td><button id="mul">*</button></td>
        </tr>
        <tr>
            <td><button id="k0" value="0">0</button></td>
            <td><button id="kdot" value=".">.</button></td>
            <td><button id="submit">=</button></td>
            <td><button id="div">/</button></td>
        </tr>
    </table>
</body>
</html>
