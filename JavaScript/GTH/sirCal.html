<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <style>
        .container {
            width: 600px;
            height: 400px;
            position: relative;
            border-radius: 10px;
            border: 2px solid #020202;
            padding: 10px;
            background-color: #020202;
            margin-left: 200px;
            margin-top: 100px;
        }

        #txtCtrl {
            position: absolute;
            width: 90%;
        }

        #txtCtrl input {
            left: 0px;
            width: 100%;
            height: 40px;
        }

        #btnPanel {
            position: absolute;
            width: 100%;
            top: 80px;
            left: 30px;
        }
    </style>
    <script type="text/javascript">
        function loadBtn() {
            let btns = [
                ['1', '2', '3', '+'],
                ['4', '5', '6', '-'],
                ['7', '8', '9', '*'],
                ['0', '.', '=', '/']
            ];
            let firstValue, secondValue, result;
            let choice = 0;
            let btnPanel = document.getElementById("btnPanel");
            let table = document.getElementById("tbl");
            for (let i = 0; i < btns.length; i++) //row
            {
                let row = document.createElement("tr");
                for (let j = 0; j < btns[i].length; j++) //col
                {
                    let col = document.createElement("td");
                    let btn = document.createElement("input"); //<input  />
                    btn.setAttribute("type", "button"); //<input type="button"  />
                    btn.setAttribute("value", "" + btns[i][j]); //<input type="button" value="btn[i][j]"  />
                    btn.style.width = "100px";
                    btn.style.height = "60px";

                    btn.addEventListener("click", function () {
                        let textBox = document.getElementById("txt");
                        let prevValue = textBox.value;
                        if (btn.value == '+') {
                            let prevValue = textBox.value;
                            firstValue = prevValue;
                            textBox.value = "";
                            choice = 1;
                        }
                        else if (btn.value == '-') {
                            let prevValue = textBox.value;
                            firstValue = prevValue;
                            textBox.value = "";
                            choice = 2;
                        }
                        else if (btn.value == '*') {
                            let prevValue = textBox.value;
                            firstValue = prevValue;
                            textBox.value = "";
                            choice = 3;
                        }
                        else if (btn.value == "=") {
                            secondValue = textBox.value;
                            switch (choice) {
                                case 1:
                                    result = parseInt(firstValue) + parseInt(secondValue);
                                    textBox.value = "" + result;
                                    break;
                                case 2:
                                    result = parseInt(firstValue) - parseInt(secondValue);
                                    textBox.value = "" + result;
                                    break;
                                case 3:
                                    result = parseInt(firstValue) * parseInt(secondValue);
                                    textBox.value = "" + result;
                                    break;
                                default:
                                    alert("Wrong choice");
                            }
                        }
                        else {
                            textBox.value = prevValue + "" + btns[i][j];
                        }


                    });
                    col.appendChild(btn);
                    row.append(col);
                }
                table.appendChild(row);
            }
            btnPanel.appendChild(table);
        }

    </script>
</head>

<body onload="loadBtn()">
    <div class="container">
        <div id="txtCtrl">
            <input type="text" name="n" id="txt" value="" />
        </div>
        <div id="btnPanel">
            <table id="tbl" style="position: absolute;left:50px;width:70%">
            </table>
        </div>
    </div>
</body>
</html>
