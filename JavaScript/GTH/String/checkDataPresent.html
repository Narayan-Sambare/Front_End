<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data present or not in input</title>
    <style></style>
    <script>
        function checkVal(){
            let val=document.getElementById("name").value;
            if(val.length==0)
            {
                alert("Please enter data");

            }
            else{
                alert("data present")
            }
        }
    </script>

</head>
<body>
    <input type="text" onblur="checkVal()" value="" id="name">

</body>
</html>
