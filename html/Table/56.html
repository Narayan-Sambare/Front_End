<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Q56.Create a table for shopping bill. -->
    <table>
        <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Price per Item</th>
            <th>Total Price</th>
        </tr>
        <tr>
            <td>Apples</td>
            <td>3 kg</td>
            <td>$2.00</td>
            <td>$6.00</td>
        </tr>
        <tr>
            <td>Bread</td>
            <td>2 loaves</td>
            <td>$1.50</td>
            <td>$3.00</td>
        </tr>
        <tr>
            <td>Milk</td>
            <td>1 liter</td>
            <td>$1.20</td>
            <td>$1.20</td>
        </tr>
        <tr>
            <td>Eggs</td>
            <td>12 pcs</td>
            <td>$0.10</td>
            <td>$1.20</td>
        </tr>
        <tr>
            <th colspan="3">Total Amount</th>
            <th>$11.40</th>
        </tr>
    </table>
</body>
</html>
