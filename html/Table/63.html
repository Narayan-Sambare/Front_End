<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    
        table {
            width: 50%;
            border-collapse: collapse;
            margin: 20px 0;
            margin: auto;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <!-- Q63.Create a table with nested tables inside cells. -->
    <table border="1">
        <tr>
            <th>Category</th>
            <th>Details</th>
        </tr>
        <tr>
            <td>Fruits</td>
            <td>
                <table border="1">
                    <tr>
                        <th>Name</th>
                        <th>Color</th>
                    </tr>
                    <tr>
                        <td>Apple</td>
                        <td>Red</td>
                    </tr>
                    <tr>
                        <td>Banana</td>
                        <td>Yellow</td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td>Vegetables</td>
            <td>
                <table border="1">
                    <tr>
                        <th>Name</th>
                        <th>Color</th>
                    </tr>
                    <tr>
                        <td>Carrot</td>
                        <td>Orange</td>
                    </tr>
                    <tr>
                        <td>Spinach</td>
                        <td>Green</td>
                    </tr>
                </table>
            </td>
        </tr>
</body>
</html>
